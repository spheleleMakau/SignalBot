services:
  - type: web
    name: step-index-trader
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    disk:
      name: step-index-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/step_index.db
      - key: APP_MODE
        value: step_index
      - key: DASHBOARD_AUTH_REQUIRED
        value: true
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: MIN_SIGNAL_SCORE
        value: 75
      - key: USD_PER_PRICE_UNIT_PER_LOT
        sync: false
      - key: TRADINGVIEW_WEBHOOK_TOKEN
        sync: false
      - key: TRADINGVIEW_SYMBOL
        sync: false